name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Intentionally no env vars: the build must succeed with none set
# (in-memory fallback / no-releases state).
jobs:
  checks:
    name: Lint, typecheck, unit, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  # Spec bar on the two pages fans land on first (mobile emulation, production
  # build): performance >= 0.90, accessibility >= 0.95, seo >= 0.95,
  # best-practices >= 0.90. Budgets live in lighthouserc.json. TEST_FIXTURES
  # makes the no-env shim serve the CHAMPION fixture so /music/champion exists.
  lighthouse:
    name: Lighthouse budgets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TEST_FIXTURES: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lhci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report
          path: .lighthouseci
          # .lighthouseci is a dotdir; without this the step silently uploads nothing.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  # RLS contract against a real local Supabase: `supabase start` applies
  # supabase/migrations + seed.sql, then the integration suite runs as the
  # anon and service roles. Needs Docker (ubuntu-latest has it).
  db-integration:
    name: Supabase RLS integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: npm ci
      - name: Start local Supabase (migrations + seed)
        run: >-
          supabase start
          -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor,realtime,postgres-meta
      - name: Export test credentials
        run: |
          supabase status -o env > /tmp/supabase.env
          # shellcheck disable=SC1091
          . /tmp/supabase.env
          {
            echo "SUPABASE_TEST_URL=$API_URL"
            echo "SUPABASE_TEST_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_TEST_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"
      - run: npm run test:integration
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
